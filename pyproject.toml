[project]
name = "rd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Greg Bishop", email = "ggb667@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.14.2",
    "psycopg[binary]>=3.2.10",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
rd = "rd:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
